services:
  - type: web
    name: indie-discovery-api
    runtime: node
    plan: free
    region: virginia
    # Sem `corepack enable`: ele grava na pasta do Node, que é somente leitura no Render.
    # --prod=false: com NODE_ENV=production o pnpm pularia as devDependencies que o build usa.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @indie/api... run build
    startCommand: npm --prefix apps/api run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: 'true'
      - key: WEB_ORIGIN
        sync: false
      - key: INTERNAL_RELOAD_SECRET
        generateValue: true
