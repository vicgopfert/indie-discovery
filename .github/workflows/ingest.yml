name: Ingestão

# Execução manual da ingestão no banco de produção (B-14). O agendamento é o B-54.
# O modo sonda-steam (B-78) só confere, de qualquer branch, se a rota de etiquetas da Steam
# responde ao Actions, numa amostra do catálogo, sem gravar nada.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: ingestao grava o catálogo; sonda-steam só lê, sem gravar nada
        type: choice
        options:
          - ingestao
          - sonda-steam
        default: ingestao

permissions:
  contents: read

# Mesmo grupo do job de migrations: os dois nunca mexem no banco de produção ao mesmo tempo, e
# nenhuma execução é cancelada no meio.
concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingestão do catálogo no banco de produção
    if: github.ref == 'refs/heads/main' && inputs.modo != 'sonda-steam'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Conexão direta do Neon, não a do pooler: a gravação é uma transação longa.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalação
        run: pnpm install --frozen-lockfile

      - name: Build da API
        run: pnpm --filter @indie/api run build

      - name: Ingestão
        run: pnpm --filter @indie/api run ingest

      # Direto no Render, sem passar pela Vercel. Se a API estiver hibernando, a chamada a acorda
      # (cerca de um minuto), e a recarga só repete a carga da inicialização.
      - name: Recarga do índice de conteúdo
        env:
          API_URL: ${{ vars.API_URL }}
          INTERNAL_RELOAD_SECRET: ${{ secrets.INTERNAL_RELOAD_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$INTERNAL_RELOAD_SECRET" ]; then
            echo "::error::Configure a variável API_URL e o segredo INTERNAL_RELOAD_SECRET do repositório."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $INTERNAL_RELOAD_SECRET" \
            "$API_URL/api/internal/reload-index")"
          echo "$response"
          { echo '## Índice de conteúdo'; echo '```'; echo "$response"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo da execução
        if: always()
        run: |
          # O psql não aceita o parâmetro schema que o Prisma usa na URL e, com sslmode=verify-*,
          # procura um certificado raiz próprio que o executor não tem: usa os do sistema.
          export PSQL_URL="$(node -e "
            const u = new URL(process.env.DATABASE_URL);
            u.searchParams.delete('schema');
            if (u.searchParams.get('sslmode')?.startsWith('verify')) u.searchParams.set('sslrootcert', 'system');
            console.log(u.toString());
          ")"
          {
            echo '## Última execução'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT status, \"startedAt\", \"finishedAt\" - \"startedAt\" AS duracao,
                \"gamesFetched\" AS buscados, \"gamesUpserted\" AS catalogo,
                \"gamesInvalid\" AS fora_do_schema, \"gamesDeactivated\" AS desativados,
                \"flagsRaised\" AS alertas, \"popularityMax\" AS pop_max,
                \"popularityMedian\" AS pop_mediana, left(\"errorSummary\", 300) AS erro
              FROM \"IngestionRun\" ORDER BY \"startedAt\" DESC LIMIT 1"
            echo '```'
            echo '## Catálogo'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT CASE
                WHEN \"releaseStatus\" = 'UPCOMING' AND \"firstReleaseDate\" IS NOT NULL THEN 'por lançar, com data'
                WHEN \"releaseStatus\" = 'UPCOMING' THEN 'por lançar, sem data'
                ELSE 'lançado' END AS grupo, count(*) AS jogos
              FROM \"Game\" WHERE \"inCatalog\" GROUP BY 1 ORDER BY 1"
            echo '```'
            echo '## País do estúdio'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT coalesce(\"studioCountrySource\"::text, 'não informado') AS origem,
                count(*) AS jogos, round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS percentual
              FROM \"Game\" WHERE \"inCatalog\" GROUP BY 1 ORDER BY 2 DESC"
            echo '```'
            echo '## Etiquetas'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT coalesce(\"tagSource\"::text, 'sem etiqueta') AS origem,
                count(*) AS jogos, round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS percentual
              FROM \"Game\" WHERE \"inCatalog\" GROUP BY 1 ORDER BY 2 DESC"
            echo '```'
            echo '## Coleções'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT c.slug, count(g.id) FILTER (WHERE g.\"inCatalog\") AS no_catalogo,
                count(g.id) FILTER (WHERE NOT g.\"inCatalog\") AS fora
              FROM \"Collection\" c
              LEFT JOIN \"CollectionGame\" cg ON cg.\"collectionId\" = c.id
              LEFT JOIN \"Game\" g ON g.id = cg.\"gameId\"
              GROUP BY c.slug, c.\"sortOrder\" ORDER BY c.\"sortOrder\""
            echo '```'
            echo '## Alertas da execução'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT f.kind, f.\"gameName\", f.detail
              FROM \"IngestionReviewFlag\" f
              WHERE f.\"runId\" = (SELECT id FROM \"IngestionRun\" ORDER BY \"startedAt\" DESC LIMIT 1)
              ORDER BY f.kind, f.\"gameName\" LIMIT 100"
            echo '```'
            echo '## Tamanho do banco'
            echo '```'
            psql "$PSQL_URL" -X -q -c "
              SELECT pg_size_pretty(pg_database_size(current_database())) AS banco"
            psql "$PSQL_URL" -X -q -c "
              SELECT relname AS tabela, pg_size_pretty(pg_total_relation_size(relid)) AS tamanho,
                n_live_tup AS vivas, n_dead_tup AS mortas
              FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 8"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  steam-probe:
    name: Sonda da Steam (só leitura)
    if: inputs.modo == 'sonda-steam'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Só lê o catálogo gravado, para escolher a amostra: nada é gravado no banco.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalação
        run: pnpm install --frozen-lockfile

      - name: Build da API
        run: pnpm --filter @indie/api run build

      # Com pipefail (shell bash), a falha da sonda falha o passo mesmo passando pelo tee.
      - name: Sonda
        shell: bash
        working-directory: apps/api
        run: node dist/probe-steam.js --games 200 | tee -a "$GITHUB_STEP_SUMMARY"
