name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Na main nada é cancelado: interromper uma migration no meio deixaria o banco inconsistente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Mesma versão do PostgreSQL embutido local; o Neon também usa a 18.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: indie
          POSTGRES_PASSWORD: indie
          POSTGRES_DB: indie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indie -d indie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://indie:indie@localhost:5432/indie?schema=public
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_RELOAD_SECRET: segredo-do-ci-usado-so-nos-testes-e2e
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalação
        run: pnpm install --frozen-lockfile

      # Só aviso: vulnerabilidade sem correção disponível não bloqueia o PR.
      - name: Auditoria de dependências
        run: pnpm audit
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Migrations
        run: pnpm --filter @indie/api exec prisma migrate deploy

      - name: Seed
        run: pnpm --filter @indie/api exec prisma db seed

      - name: Testes e2e
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  migrate-production:
    name: Migrations e seed no banco de produção
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesmo grupo da ingestão: migration e ingestão nunca rodam juntas no banco de produção.
    concurrency:
      group: production-database
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalação
        run: pnpm install --frozen-lockfile

      - name: Migrations
        run: pnpm --filter @indie/api exec prisma migrate deploy

      - name: Seed
        run: pnpm --filter @indie/api exec prisma db seed
