packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.9"
  - "@nestjs/common@12.2.0"
  - "@nestjs/core@12.2.0"
  - "@nestjs/platform-express@12.2.0"
  - "@nestjs/testing@12.2.0"
